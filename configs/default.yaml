# WaferVision default configuration
defaults:
  - backbone: resnet50
  - training: finetune
  - _self_

# Data configuration
data:
  raw_path: data/raw/LSWMD.pkl
  processed_dir: data/processed
  target_size: 64
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  num_workers: 4
  augmentation_strength: medium

# Model configuration
model:
  backbone: resnet50
  pretrained: true
  l2_normalize: false
  embedding_dim: null  # auto-determined by backbone

# Training configuration
training:
  mode: finetune  # pretrained | finetune | metric | selfsupervised
  epochs: 50
  batch_size: 64
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: adam
  gradient_clip_max_norm: 1.0
  early_stopping_patience: 10
  enable_class_weights: true
  # Metric learning specific
  loss: triplet  # triplet | supcon | ntxent | crossentropy
  margin: 0.2
  temperature: 0.07
  P_classes: 9
  K_samples: 4
  warmup_epochs: 5
  # Self-supervised specific
  simclr_temperature: 0.5
  gradient_accumulation_steps: 4

# Evaluation configuration
evaluation:
  knn_k_values: [1, 3, 5, 10]
  recall_k_values: [1, 5, 10]
  bootstrap_iterations: 1000
  subsample_size: 10000
  distance_metric: euclidean  # euclidean | cosine

# Anomaly detection
anomaly:
  threshold_sigma: 2.0
  method: centroid  # centroid | lof
  per_class_threshold: false

# Visualization
visualization:
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  umap_metric: euclidean
  tsne_perplexity: 30
  max_points: 50000

# Logging
logging:
  level: INFO
  output: both
  json_format: true
  log_dir: logs/

# Paths
paths:
  checkpoints: outputs/checkpoints
  embeddings: outputs/embeddings
  metrics: outputs/metrics
  figures: outputs/figures
